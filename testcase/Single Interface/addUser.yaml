- base_info:
    api_name: 新增用户
    url: /dar/user/addUser
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  test_case:
    - case_name: 正常新增用户
      data:
        username: testadduser
        password: tset6789890
        role_id: 123456789
        dates: '2026-5-31'
        phone: 13800000000
        token: ${get_extract_data(token)}
      validation:
        - contains: { status_code: 200 }
        - contains: { msg: '新增成功'}
    - case_name: 无效新增-缺少token
      data:
        username: testadduser
        password: tset6789890
        role_id: 123456789
        dates: '2026-5-31'
        phone: 13800000000
      validation:
        - contains: { status_code: 200 }
        - contains: { msg: '新增失败'}
        - eq: { msg_code: 9001 }
    - case_name: 无效新增-缺少必填参数username
      data:
        password: tset6789890
        role_id: 123456789
        dates: '2026-5-31'
        phone: 13800000000
        token: ${get_extract_data(token)}
      validation:
        - contains: { status_code: 200 }
        - contains: { msg: '新增失败'}
        - eq: { msg_code: 9001 }
    - case_name: 无效新增-缺少必填参数role_id
      data:
        username: testadduser
        password: tset6789890
        dates: '2026-5-31'
        phone: 13800000000
        token: ${get_extract_data(token)}
      validation:
        - contains: { status_code: 200 }
        - contains: { msg: '新增失败'}
        - eq: { msg_code: 9001 }